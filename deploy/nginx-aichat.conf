# Copy to /etc/nginx/sites-available/aichat and symlink into sites-enabled.
# Public access: http://pelegant.info/  (then certbot for https://pelegant.info/)
#
# After DNS A record points to the VPS, run:
#   sudo certbot --nginx -d pelegant.info -d www.pelegant.info

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name pelegant.info www.pelegant.info;

  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Realtime chat — accept /ws and /ws/ (no 301; browsers cannot follow WS redirects)
  # HTTP:  VITE_WS_URL=ws://pelegant.info/ws
  # HTTPS: VITE_WS_URL=wss://pelegant.info/ws
  location = /ws {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
  }

  location /ws/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
  }
}
