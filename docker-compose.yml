services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: compamore
      POSTGRES_PASSWORD: compamore
      POSTGRES_DB: compamore
    ports:
      - "5433:5432"
    volumes:
      - compamore_pg:/var/lib/postgresql/data
volumes:
  compamore_pg:
