name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 06:00 UTC so newly published advisories surface before a release.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Scan dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit (fails on high/critical)
        id: audit
        run: node scripts/audit-deps.mjs --level=high | tee audit-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: audit-report.txt
          if-no-files-found: ignore

      - name: Open/refresh alert issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'The scheduled dependency audit failed. See the workflow run for details.';
            try {
              body = '```\n' + fs.readFileSync('audit-report.txt', 'utf8').slice(0, 60000) + '\n```';
            } catch {}
            const title = 'Dependency audit: high/critical vulnerabilities detected';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
            });
            const existing = issues.find((i) => i.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const full = `${body}\n\n[Workflow run](${runUrl})`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: full,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['security'],
                body: full,
              });
            }
